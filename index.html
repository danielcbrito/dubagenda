    <!-- Anti-flash + Detecção de iOS Safari em modo navegador -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          d.style.backgroundColor = '#FFFFFF';
          d.style.colorScheme = 'light';
          if (!d.classList.contains('light')) d.classList.add('light');
          if (document.body) {
            document.body.style.backgroundColor = '#FFFFFF';
            document.body.style.colorScheme = 'light';
          }
          // Detecta Safari no iPhone/iPad quando executando no NAVEGADOR (fora do PWA instalado)
          var ua = window.navigator.userAgent || '';
          var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          var isStandalone = (window.navigator.standalone === true) || 
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
          if (isIOS && !isStandalone) {
            d.classList.add('ios-safari-browser');
          }
        } catch (e) {}
      })();
    </script>
